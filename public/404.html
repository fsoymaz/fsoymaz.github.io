<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages 404 redirect - Single Page App support
      (function () {
        // Store the original path
        var path = window.location.pathname;

        // Don't redirect Google verification files or other static HTML files
        if (path.includes("google") || path.endsWith(".html")) {
          // Let Google verification files and other HTML files load normally
          return;
        }

        // If it's not the root and not a Next.js internal path, redirect to index
        if (path !== "/" && !path.startsWith("/_next") && !path.includes(".")) {
          // Try to load index.html and let client-side routing handle it
          window.location.replace("/");
        }
      })();
    </script>
  </head>
  <body>
    <p>Yönlendiriliyor...</p>
    <script>
      // Only redirect if not a Google verification file or HTML file
      var path = window.location.pathname;
      if (!path.includes("google") && !path.endsWith(".html")) {
        setTimeout(function () {
          window.location.replace("/");
        }, 100);
      }
    </script>
  </body>
</html>
